[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-data-quality"
version = "0.1.0"
description = "営業案件CSV/Excelの整形・検証・集計を行うStreamlitアプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_data_quality"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".tmp-devtools", "仕様書.md"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
